<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="google-site-verification" content="R_e8E9Ga3FSMDd3Z_H1SpU8hkM8lMW25IpkPWFbMAxM" />
    <title>起案者作業ページ | レボファンディング</title>
    <meta name="description" content="レボファンディングの起案者用作業ページです。記事、画像、商品情報、目標値、BASEリンクを整理できます。" />
    <link rel="icon" href="favicon.ico?v=20260602" sizes="any" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .work-root {
        min-height: 100vh;
        background: #f7f8fb;
      }
      .work-hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(320px, 0.72fr);
        gap: clamp(24px, 5vw, 64px);
        align-items: center;
        padding: clamp(42px, 7vw, 82px) clamp(20px, 5vw, 76px);
        background: linear-gradient(110deg, #fff7f7 0%, #f8fbff 58%, #eaf4ff 100%);
      }
      .work-hero h1 {
        margin: 12px 0 18px;
        font-size: clamp(44px, 8vw, 94px);
        line-height: 0.96;
      }
      .work-panel,
      .work-card {
        border: 1px solid rgba(17, 24, 39, 0.1);
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 18px 48px rgba(17, 24, 39, 0.07);
      }
      .work-panel {
        padding: clamp(24px, 4vw, 42px);
      }
      .work-section {
        padding: clamp(32px, 5vw, 70px) clamp(20px, 5vw, 76px);
      }
      .work-card {
        padding: clamp(22px, 3vw, 34px);
      }
      .work-card h2,
      .work-card h3 {
        margin-top: 0;
      }
      .work-form {
        display: grid;
        gap: 22px;
      }
      .work-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
      .work-form label {
        display: grid;
        gap: 8px;
        color: #111827;
        font-weight: 800;
      }
      .work-form input,
      .work-form textarea {
        width: 100%;
        border: 1px solid rgba(17, 24, 39, 0.12);
        border-radius: 12px;
        background: #f9fafb;
        color: #111827;
        font: inherit;
        font-weight: 700;
      }
      .work-form input {
        min-height: 56px;
        padding: 0 16px;
      }
      .work-form textarea {
        min-height: 132px;
        padding: 14px 16px;
        resize: vertical;
      }
      .work-form .work-body {
        min-height: 280px;
      }
      .work-help {
        color: #6b7280;
        font-size: 14px;
        font-weight: 700;
        line-height: 1.7;
      }
      .work-save-status {
        min-height: 52px;
        margin-top: 14px;
        padding: 14px 16px;
        border: 1px solid rgba(37, 99, 235, 0.16);
        border-radius: 14px;
        background: #eff6ff;
        color: #1f2937;
        font-weight: 800;
        line-height: 1.65;
      }
      .work-save-status.is-error {
        border-color: rgba(220, 38, 38, 0.22);
        background: #fff1f2;
      }
      .work-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 18px;
      }
      .work-actions button,
      .work-actions a {
        border: 0;
      }
      .work-preview-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(320px, 0.42fr);
        gap: 20px;
        margin-top: 24px;
      }
      .work-preview {
        padding: 22px;
        border: 1px solid rgba(17, 24, 39, 0.1);
        border-radius: 16px;
        background: #f9fafb;
      }
      .work-preview p {
        color: #4b5563;
        font-size: 16px;
        line-height: 1.85;
      }
      .work-field-list {
        display: grid;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .work-field-list li {
        padding: 12px 14px;
        border-radius: 12px;
        background: #eef6ff;
        color: #1f2937;
        font-weight: 800;
      }
      .work-output {
        width: 100%;
        min-height: 180px;
        margin-top: 16px;
        padding: 14px;
        border: 1px solid rgba(17, 24, 39, 0.12);
        border-radius: 12px;
        background: #f9fafb;
        resize: vertical;
      }
      .work-muted {
        color: #6b7280;
      }
      @media (max-width: 900px) {
        .work-hero,
        .work-grid,
        .work-preview-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body class="work-root">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="レボファンディング トップへ">
        <span class="brand-mark" aria-hidden="true">R</span>
        <span><strong>レボファンディング</strong><small>Work Room</small></span>
      </a>
      <nav class="nav" aria-label="主要ナビゲーション">
        <a href="index.html">トップ</a>
        <a href="challenger.html">挑戦する</a>
        <a href="supporters.html">応援する</a>
        <a href="representative.html">運営</a>
      </nav>
    </header>

    <main id="work-root">
      <section class="section">
        <div class="project-empty-state">
          <strong>作業ページを読み込んでいます。</strong>
          <span>Projectsシートの下書きを確認しています。</span>
        </div>
      </section>
    </main>

    <div class="toast" role="status" aria-live="polite">保存しました</div>

    <script src="site-config.js?v=20260609-work-save-2"></script>
    <script>
      const PROJECTS_CSV_URL = window.REVO_PROJECTS_DATA_URL || "https://docs.google.com/spreadsheets/d/e/2PACX-1vRcKmEgg9vkR0RHr8i1dbqnjOCZS7Julyl54k9tqUEBGxEejykf3X5eS4iZOKnsowGrtwiGZ7b7vRBN/pub?gid=563776916&single=true&output=csv";
      const WORK_SAVE_ENDPOINT = window.REVO_PROJECT_WORK_SAVE_ENDPOINT || "";
      const root = document.getElementById("work-root");

      function parseCsv(text) {
        const rows = [];
        let row = [];
        let value = "";
        let quoted = false;
        for (let index = 0; index < text.length; index += 1) {
          const char = text[index];
          const next = text[index + 1];
          if (char === '"' && quoted && next === '"') {
            value += '"';
            index += 1;
          } else if (char === '"') {
            quoted = !quoted;
          } else if (char === "," && !quoted) {
            row.push(value);
            value = "";
          } else if ((char === "\n" || char === "\r") && !quoted) {
            if (char === "\r" && next === "\n") index += 1;
            row.push(value);
            if (row.some((cell) => cell !== "")) rows.push(row);
            row = [];
            value = "";
          } else {
            value += char;
          }
        }
        row.push(value);
        if (row.some((cell) => cell !== "")) rows.push(row);
        const headers = rows.shift().map((header) => header.trim());
        return rows.map((cells) => headers.reduce((record, header, index) => {
          record[header] = cells[index] || "";
          return record;
        }, {}));
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function draftStorageKey(projectId) {
        return `revo-project-work-draft:${projectId}`;
      }

      function loadLocalDraft(projectId) {
        try {
          return JSON.parse(localStorage.getItem(draftStorageKey(projectId)) || "{}");
        } catch (error) {
          return {};
        }
      }

      function saveLocalDraft(projectId, values) {
        localStorage.setItem(draftStorageKey(projectId), JSON.stringify(values));
      }

      async function saveProjectToManagement(projectId, values) {
        if (!WORK_SAVE_ENDPOINT) {
          return false;
        }

        const editKey = new URLSearchParams(location.search).get("key") || "";
        await fetch(WORK_SAVE_ENDPOINT, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            action: "saveProjectWorkDraft",
            project_id: projectId,
            edit_key: editKey,
            values
          })
        });
        return true;
      }

      function showToast(message) {
        const toast = document.querySelector(".toast");
        if (!toast) return;
        toast.textContent = message;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 1800);
      }

      function showStatus(message, isError = false) {
        const status = root.querySelector("[data-save-status]");
        if (!status) return;
        status.textContent = message;
        status.classList.toggle("is-error", Boolean(isError));
      }

      async function copyText(text) {
        try {
          await navigator.clipboard.writeText(text);
          showToast("運営へ送る内容をコピーしました");
        } catch (error) {
          showToast("送信用テキストを作成しました");
        }
      }

      function cleanNumber(value) {
        return String(value || "").replace(/[^\d]/g, "");
      }

      function paragraphs(text) {
        return String(text || "")
          .split(/\n{2,}|\r?\n/)
          .map((item) => item.trim())
          .filter(Boolean);
      }

      function collectForm(form) {
        const data = {};
        new FormData(form).forEach((value, key) => {
          data[key] = String(value || "").trim();
        });
        data.target_amount = cleanNumber(data.target_amount);
        data.target_supporters = cleanNumber(data.target_supporters);
        data.fan_target_after_success = cleanNumber(data.fan_target_after_success);
        data.supporter_unit_amount = cleanNumber(data.supporter_unit_amount);
        return data;
      }

      function valueOf(project, key, fallback = "") {
        return project[key] || fallback || "";
      }

      function renderLivePreview(data, project) {
        const title = data.title || project.title || "Projectタイトル未設定";
        const shortDescription = data.short_description || project.short_description || "短い説明は未入力です。";
        const body = data.detail_description || project.detail_description || "";
        const bodyHtml = paragraphs(body).length
          ? paragraphs(body).map((paragraph) => `<p>${escapeHtml(paragraph)}</p>`).join("")
          : "<p class='work-muted'>本文を入力するとここに確認表示されます。</p>";
        const imageCount = [data.main_visual_uploads, data.product_image_uploads, data.body_image_uploads, data.creator_profile_uploads]
          .join("\n")
          .split(/\r?\n|,|、/)
          .map((item) => item.trim())
          .filter(Boolean)
          .length;

        return `
          <div class="work-preview-grid">
            <article class="work-preview">
              <p class="eyebrow">Writing Preview</p>
              <h2>${escapeHtml(title)}</h2>
              <p class="lead">${escapeHtml(shortDescription)}</p>
              <h3>本文</h3>
              ${bodyHtml}
            </article>
            <aside class="work-preview">
              <h3>入力状況</h3>
              <ul class="work-field-list">
                <li>画像: ${imageCount}点</li>
                <li>目標金額: ${data.target_amount || "未入力"}円</li>
                <li>目標応援人数: ${data.target_supporters || "未入力"}人</li>
                <li>BASE URL: ${data.base_product_url ? "入力済み" : "未入力"}</li>
              </ul>
            </aside>
          </div>
        `;
      }

      function render(project) {
        const projectId = project.project_id || project.id;
        const editKey = new URLSearchParams(location.search).get("key") || project.edit_key || "";
        const saved = loadLocalDraft(projectId);
        const data = { ...project, ...saved };
        const previewUrl = `project-preview.html?id=${encodeURIComponent(projectId)}${editKey ? `&key=${encodeURIComponent(editKey)}` : ""}`;
        document.title = `${data.title || "Project"} 作業ページ | レボファンディング`;

        root.innerHTML = `
          <section class="work-hero">
            <div>
              <p class="eyebrow">Project Work Room</p>
              <h1>${escapeHtml(data.title || "Projectタイトル未設定")}</h1>
              <p class="lead">ここで本文、画像メモ、目標、商品情報を整えます。入力内容はこのブラウザに下書き保存されます。</p>
              <div class="project-status-row"><span class="status next">${escapeHtml(data.status || "draft")}</span><span>project_id: ${escapeHtml(projectId)}</span>${editKey ? "<span>専用URL</span>" : "<span>編集キーなし</span>"}</div>
            </div>
            <div class="work-panel">
              <span class="eyebrow">流れ</span>
              <h2>作業してから確認へ</h2>
              <p>このページで書く、下書き保存する、確認ページで公開前の見え方を確認する、最後に運営へ送る、という流れです。</p>
              <div class="work-actions">
                <a class="button primary" href="#work-form">入力する</a>
                <a class="button secondary" href="${previewUrl}">確認ページを見る</a>
              </div>
            </div>
          </section>

          <section class="work-section" id="work-form">
            <article class="work-card">
              <p class="eyebrow">Work Form</p>
              <h2>作業ページで入力する</h2>
              <form class="work-form" data-work-form>
                <div class="work-grid">
                  <label>Projectタイトル<input name="title" value="${escapeHtml(valueOf(data, "title"))}" placeholder="例: おのくん" /></label>
                  <label>キャッチコピー<input name="subtitle" value="${escapeHtml(valueOf(data, "subtitle"))}" placeholder="例: 小さな挑戦を、みんなで育てる。" /></label>
                </div>
                <label>短い説明<textarea name="short_description" placeholder="公開ページの冒頭に表示する短い説明">${escapeHtml(valueOf(data, "short_description"))}</textarea></label>
                <label>詳細本文<textarea class="work-body" name="detail_description" placeholder="挑戦の背景、なぜ今やるのか、誰に届けたいのか、次の循環で何をしたいのかを書いてください。">${escapeHtml(valueOf(data, "detail_description"))}</textarea></label>

                <div class="work-grid">
                  <label>タイトル画像・メインビジュアル<textarea name="main_visual_uploads" placeholder="Googleフォームで提出済みの画像URL、またはDrive共有URL">${escapeHtml(valueOf(data, "main_visual_uploads") || valueOf(data, "title_image_urls") || valueOf(data, "main_image_url"))}</textarea></label>
                  <label>商品写真・商品イメージ画像<textarea name="product_image_uploads" placeholder="複数ある場合は改行で入力">${escapeHtml(valueOf(data, "product_image_uploads") || valueOf(data, "detail_image_urls"))}</textarea></label>
                  <label>本文中に使いたい写真・画像<textarea name="body_image_uploads" placeholder="複数ある場合は改行で入力">${escapeHtml(valueOf(data, "body_image_uploads"))}</textarea></label>
                  <label>プロフィール画像・ロゴ画像<textarea name="creator_profile_uploads" placeholder="起案者紹介に使う画像">${escapeHtml(valueOf(data, "creator_profile_uploads") || valueOf(data, "creator_image_url"))}</textarea></label>
                </div>

                <label>画像の掲載位置・説明メモ<textarea name="image_placement_note" placeholder="例: メイン画像にしたい、本文2段落目の後に入れたい、ロゴは小さめに使ってほしい">${escapeHtml(valueOf(data, "image_placement_note"))}</textarea></label>
                <div class="work-grid">
                  <label>画像の使用許可<input name="image_rights_confirmed" value="${escapeHtml(valueOf(data, "image_rights_confirmed"))}" placeholder="例: 自分たちで撮影・作成した画像です" /></label>
                  <label>画像について運営に伝えたいこと<input name="image_submission_note" value="${escapeHtml(valueOf(data, "image_submission_note"))}" placeholder="差し替え希望、撮影者名、掲載注意など" /></label>
                </div>

                <div class="work-grid">
                  <label>商品種別<input name="product_type" value="${escapeHtml(valueOf(data, "product_type"))}" placeholder="例: Tシャツ、帽子、トートバッグ" /></label>
                  <label>BASE商品URL<input name="base_product_url" value="${escapeHtml(valueOf(data, "base_product_url"))}" placeholder="https://..." /></label>
                  <label>目標金額<input name="target_amount" inputmode="numeric" value="${escapeHtml(valueOf(data, "target_amount"))}" placeholder="200000" /></label>
                  <label>目標応援人数<input name="target_supporters" inputmode="numeric" value="${escapeHtml(valueOf(data, "target_supporters"))}" placeholder="20" /></label>
                  <label>達成後ファン目標<input name="fan_target_after_success" inputmode="numeric" value="${escapeHtml(valueOf(data, "fan_target_after_success"))}" placeholder="300" /></label>
                  <label>一人あたりの応援金額<input name="supporter_unit_amount" inputmode="numeric" value="${escapeHtml(valueOf(data, "supporter_unit_amount"))}" placeholder="10000" /></label>
                </div>

                <label>運営へのメモ<textarea name="operation_note" placeholder="相談したいこと、確認してほしいこと、公開前に整えたいこと">${escapeHtml(valueOf(data, "operation_note"))}</textarea></label>
                <p class="work-help">下書き保存は、このブラウザの中に保存されます。運営へ反映する場合は「運営へ送る内容をコピー」で送ってください。</p>
                <div class="work-actions">
                  <button class="button primary" type="button" data-save>ブラウザ下書き保存</button>
                  <button class="button primary" type="button" data-save-remote>管理表へ保存</button>
                  <a class="button secondary" href="${previewUrl}" data-preview-link>確認ページを見る</a>
                  <button class="button secondary" type="button" data-copy>運営へ送る内容をコピー</button>
                </div>
                <div class="work-save-status" data-save-status>入力後、まず「ブラウザ下書き保存」を押してください。管理表へ反映する場合は「管理表へ保存」を押します。</div>
              </form>
              <div data-live-preview>${renderLivePreview(data, project)}</div>
              <textarea class="work-output" data-output readonly placeholder="コピー用の内容がここに生成されます。"></textarea>
            </article>
          </section>
        `;

        const form = root.querySelector("[data-work-form]");
        const output = root.querySelector("[data-output]");
        const livePreview = root.querySelector("[data-live-preview]");

        function currentData() {
          return collectForm(form);
        }

        function saveLocal() {
          const next = currentData();
          saveLocalDraft(projectId, next);
          livePreview.innerHTML = renderLivePreview(next, project);
          showStatus("ブラウザに下書き保存しました。確認ページを見ると、このブラウザ内の下書きが反映されます。");
          showToast("下書きを保存しました");
          return next;
        }

        async function saveRemote() {
          const next = saveLocal();
          if (!WORK_SAVE_ENDPOINT) {
            showStatus("管理表への保存先が未接続です。site-config.jsにWebアプリURLが入っているか確認してください。", true);
            showToast("管理表保存は未接続です");
            return next;
          }

          await saveProjectToManagement(projectId, next);
          showStatus("管理表へ保存リクエストを送りました。数秒後にProjectsシートと確認ページを更新して確認してください。");
          showToast("管理表へ保存しました");
          return next;
        }

        form.addEventListener("input", () => {
          const next = currentData();
          saveLocalDraft(projectId, next);
          livePreview.innerHTML = renderLivePreview(next, project);
        });

        root.querySelector("[data-save]")?.addEventListener("click", saveLocal);
        root.querySelector("[data-save-remote]")?.addEventListener("click", () => {
          saveRemote().catch(() => {
            showStatus("管理表への保存に失敗しました。Apps Scriptのデプロイ権限、またはWebアプリURLを確認してください。", true);
            showToast("管理表保存に失敗しました");
          });
        });
        root.querySelector("[data-preview-link]")?.addEventListener("click", () => {
          saveLocal();
        });
        root.querySelector("[data-copy]")?.addEventListener("click", () => {
          const next = saveLocal();
          const text = [
            "【レボファンディング 起案者作業内容】",
            `project_id: ${projectId}`,
            `確認ページ: ${location.origin}${location.pathname.replace("project-work.html", "project-preview.html")}?id=${encodeURIComponent(projectId)}${editKey ? `&key=${encodeURIComponent(editKey)}` : ""}`,
            "",
            "【タイトル】",
            next.title || "",
            "",
            "【キャッチコピー】",
            next.subtitle || "",
            "",
            "【短い説明】",
            next.short_description || "",
            "",
            "【詳細本文】",
            next.detail_description || "",
            "",
            "【画像】",
            `タイトル画像・メインビジュアル:\n${next.main_visual_uploads || ""}`,
            `商品写真・商品イメージ画像:\n${next.product_image_uploads || ""}`,
            `本文中に使いたい写真・画像:\n${next.body_image_uploads || ""}`,
            `プロフィール画像・ロゴ画像:\n${next.creator_profile_uploads || ""}`,
            "",
            "【画像メモ】",
            next.image_placement_note || "",
            next.image_rights_confirmed || "",
            next.image_submission_note || "",
            "",
            "【商品・目標】",
            `商品種別: ${next.product_type || ""}`,
            `BASE商品URL: ${next.base_product_url || ""}`,
            `目標金額: ${next.target_amount || ""}`,
            `目標応援人数: ${next.target_supporters || ""}`,
            `達成後ファン目標: ${next.fan_target_after_success || ""}`,
            `一人あたりの応援金額: ${next.supporter_unit_amount || ""}`,
            "",
            "【運営へのメモ】",
            next.operation_note || ""
          ].join("\n");
          output.value = text;
          copyText(text);
        });
      }

      function renderMissingProjectId() {
        root.innerHTML = `
          <section class="work-section">
            <article class="work-card">
              <p class="eyebrow">Project Work Room</p>
              <h1>project_idがありません。</h1>
              <p class="lead">作業ページは、起案者ごとのproject_id付きURLで開きます。</p>
              <div class="work-form">
                <label>project_id<input data-project-id-input value="revo-20260608-おのくん-2" /></label>
                <div class="work-actions">
                  <button class="button primary" type="button" data-open-project>このproject_idで開く</button>
                  <a class="button secondary" href="project-work.html?id=revo-20260608-%E3%81%8A%E3%81%AE%E3%81%8F%E3%82%93-2">おのくん作業ページを開く</a>
                </div>
              </div>
            </article>
          </section>
        `;
        root.querySelector("[data-open-project]")?.addEventListener("click", () => {
          const projectId = root.querySelector("[data-project-id-input]")?.value.trim();
          if (projectId) {
            location.href = `project-work.html?id=${encodeURIComponent(projectId)}`;
          }
        });
      }

      async function init() {
        const id = new URLSearchParams(location.search).get("id");
        if (!id) {
          renderMissingProjectId();
          return;
        }

        try {
          const response = await fetch(PROJECTS_CSV_URL, { cache: "no-store" });
          const projects = parseCsv(await response.text());
          const project = projects.find((item) => item.project_id === id || item.id === id);
          if (!project) throw new Error("Project not found");
          render(project);
        } catch (error) {
          root.innerHTML = "<section class='section'><div class='project-empty-state'><strong>Projectが見つかりません。</strong><span>ProjectsシートのCSV公開、またはproject_idを確認してください。</span></div></section>";
        }
      }

      init();
    </script>
  </body>
</html>
