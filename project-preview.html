<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>起案者確認ページ | レボファンディング</title>
    <meta name="description" content="レボファンディングの起案者向け公開前確認ページです。" />
    <link rel="icon" href="favicon.ico?v=20260602" sizes="any" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .preview-root {
        background: #f7f8fb;
        min-height: 100vh;
      }
      .preview-hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(320px, 0.75fr);
        gap: clamp(24px, 5vw, 64px);
        align-items: center;
        padding: clamp(38px, 6vw, 72px) clamp(20px, 5vw, 76px);
        background: linear-gradient(110deg, #fff7f7 0%, #f8fbff 58%, #eaf4ff 100%);
      }
      .preview-hero h1 {
        margin: 12px 0 18px;
        font-size: clamp(44px, 8vw, 96px);
        line-height: 0.96;
      }
      .preview-panel,
      .preview-card {
        border: 1px solid rgba(17, 24, 39, 0.1);
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 18px 48px rgba(17, 24, 39, 0.07);
      }
      .preview-panel {
        padding: clamp(24px, 4vw, 42px);
      }
      .preview-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(320px, 0.45fr);
        gap: 20px;
        padding: clamp(36px, 5vw, 72px) clamp(20px, 5vw, 76px);
      }
      .preview-card {
        padding: clamp(22px, 3vw, 34px);
      }
      .preview-card h2 {
        margin-top: 0;
      }
      .preview-card h3 {
        margin: 28px 0 12px;
      }
      .preview-section {
        padding: clamp(28px, 4vw, 56px) clamp(20px, 5vw, 76px);
      }
      .preview-stack {
        display: grid;
        gap: 18px;
      }
      .preview-field-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .preview-field {
        min-height: 94px;
        padding: 16px;
        border: 1px solid rgba(17, 24, 39, 0.1);
        border-radius: 14px;
        background: #f9fafb;
      }
      .preview-field span {
        display: block;
        margin-bottom: 8px;
        color: #6b7280;
        font-size: 13px;
        font-weight: 700;
      }
      .preview-field strong {
        display: block;
        color: #111827;
        font-size: 17px;
        line-height: 1.55;
        overflow-wrap: anywhere;
      }
      .preview-note-list {
        display: grid;
        gap: 10px;
        margin: 18px 0 0;
        padding: 0;
        list-style: none;
      }
      .preview-note-list li {
        padding: 14px 16px;
        border: 1px solid rgba(37, 99, 235, 0.16);
        border-radius: 14px;
        background: #eff6ff;
        color: #1f2937;
      }
      .preview-image-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .preview-image-grid img,
      .preview-main-image img,
      .preview-story img {
        width: 100%;
        border-radius: 12px;
        background: #eef2f7;
        object-fit: contain;
      }
      .preview-main-image img {
        max-height: 460px;
      }
      .preview-image-grid img {
        aspect-ratio: 4 / 3;
      }
      .preview-image-tile {
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(17, 24, 39, 0.1);
        border-radius: 14px;
        background: #eef2f7;
      }
      .preview-image-tile a {
        display: block;
        color: inherit;
        text-decoration: none;
      }
      .preview-image-tile img {
        display: block;
      }
      .preview-image-tile figcaption {
        padding: 10px 12px;
        color: #374151;
        font-size: 13px;
        font-weight: 700;
      }
      .preview-image-tile.is-missing img {
        display: none;
      }
      .preview-image-tile.is-missing::before {
        content: "画像の共有権限を確認してください";
        display: grid;
        min-height: 180px;
        place-items: center;
        padding: 18px;
        color: #4b5563;
        text-align: center;
      }
      .preview-story p {
        color: #4b5563;
        font-size: 17px;
        line-height: 1.9;
      }
      .preview-story figure {
        margin: 22px 0;
      }
      .preview-summary {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin-top: 22px;
      }
      .preview-summary .preview-field {
        min-height: 82px;
      }
      .preview-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 18px;
      }
      .preview-actions button {
        border: 0;
      }
      .preview-output {
        width: 100%;
        min-height: 160px;
        margin-top: 16px;
        padding: 14px;
        border: 1px solid rgba(17, 24, 39, 0.12);
        border-radius: 12px;
        resize: vertical;
      }
      .preview-muted {
        color: #6b7280;
      }
      .preview-mode-note {
        margin: 18px 0 0;
        padding: 14px 16px;
        border: 1px solid rgba(37, 99, 235, 0.18);
        border-radius: 14px;
        background: #eff6ff;
        color: #1f2937;
        font-weight: 800;
        line-height: 1.7;
      }
      @media (max-width: 900px) {
        .preview-hero,
        .preview-grid,
        .preview-field-grid,
        .preview-summary {
          grid-template-columns: 1fr;
        }
        .preview-image-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body class="preview-root">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="レボファンディング トップへ">
        <span class="brand-mark" aria-hidden="true">R</span>
        <span><strong>レボファンディング</strong><small>Preview</small></span>
      </a>
      <nav class="nav" aria-label="主要ナビゲーション">
        <a href="index.html">トップ</a>
        <a href="challenger.html">挑戦する</a>
        <a href="supporters.html">応援する</a>
        <a href="representative.html">運営</a>
      </nav>
    </header>

    <main id="preview-root">
      <section class="section">
        <div class="project-empty-state">
          <strong>確認ページを読み込んでいます。</strong>
          <span>Projectsシートの下書きを確認しています。</span>
        </div>
      </section>
    </main>

    <div class="toast" role="status" aria-live="polite">コピーしました</div>

    <script>
      const PROJECTS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRcKmEgg9vkR0RHr8i1dbqnjOCZS7Julyl54k9tqUEBGxEejykf3X5eS4iZOKnsowGrtwiGZ7b7vRBN/pub?gid=563776916&single=true&output=csv";
      const root = document.getElementById("preview-root");

      function parseCsv(text) {
        const rows = [];
        let row = [];
        let value = "";
        let quoted = false;
        for (let index = 0; index < text.length; index += 1) {
          const char = text[index];
          const next = text[index + 1];
          if (char === '"' && quoted && next === '"') {
            value += '"';
            index += 1;
          } else if (char === '"') {
            quoted = !quoted;
          } else if (char === "," && !quoted) {
            row.push(value);
            value = "";
          } else if ((char === "\n" || char === "\r") && !quoted) {
            if (char === "\r" && next === "\n") index += 1;
            row.push(value);
            if (row.some((cell) => cell !== "")) rows.push(row);
            row = [];
            value = "";
          } else {
            value += char;
          }
        }
        row.push(value);
        if (row.some((cell) => cell !== "")) rows.push(row);
        const headers = rows.shift().map((header) => header.trim());
        return rows.map((cells) => headers.reduce((record, header, index) => {
          record[header] = cells[index] || "";
          return record;
        }, {}));
      }

      function driveImageUrl(value) {
        const text = String(value || "").trim();
        if (!text) return "";
        const match = text.match(/[?&]id=([^&]+)/) || text.match(/\/file\/d\/([^/]+)/);
        if (!match) return text;
        return `https://drive.google.com/thumbnail?id=${encodeURIComponent(match[1])}&sz=w1400`;
      }

      function driveOpenUrl(value) {
        const text = String(value || "").trim();
        if (!text) return "";
        const match = text.match(/[?&]id=([^&]+)/) || text.match(/\/file\/d\/([^/]+)/);
        if (!match) return text;
        return `https://drive.google.com/open?id=${encodeURIComponent(match[1])}`;
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function displayValue(value, fallback = "未入力") {
        const text = String(value || "").trim();
        return text ? escapeHtml(text) : `<span class="preview-muted">${fallback}</span>`;
      }

      function numberText(value, suffix = "") {
        const number = Number(String(value || "").replace(/[^\d.-]/g, ""));
        if (!Number.isFinite(number) || number <= 0) return "未入力";
        return `${number.toLocaleString("ja-JP")}${suffix}`;
      }

      function draftStorageKey(projectId) {
        return `revo-project-work-draft:${projectId}`;
      }

      function loadLocalDraft(projectId) {
        try {
          return JSON.parse(localStorage.getItem(draftStorageKey(projectId)) || "{}");
        } catch (error) {
          return {};
        }
      }

      function splitList(value) {
        return String(value || "")
          .split(/\r?\n|,|、/)
          .map((item) => item.trim())
          .filter(Boolean);
      }

      function imageList(...values) {
        const seen = new Set();
        return values
          .flatMap(splitList)
          .map((src) => driveImageUrl(src))
          .filter(Boolean)
          .filter((src) => {
            if (seen.has(src)) return false;
            seen.add(src);
            return true;
          });
      }

      function imageEntries(...values) {
        const seen = new Set();
        return values
          .flatMap(splitList)
          .map((raw) => ({ raw, src: driveImageUrl(raw), href: driveOpenUrl(raw) }))
          .filter((image) => image.src)
          .filter((image) => {
            if (seen.has(image.href)) return false;
            seen.add(image.href);
            return true;
          })
          .map((image, index) => ({ ...image, label: `画像${index + 1}` }));
      }

      function imageTile(image, alt) {
        return `
          <figure class="preview-image-tile">
            <a href="${escapeHtml(image.href)}" target="_blank" rel="noopener">
              <img src="${escapeHtml(image.src)}" alt="${escapeHtml(alt)}" onerror="this.closest('.preview-image-tile').classList.add('is-missing')" />
              <figcaption>${escapeHtml(image.label)}を開く</figcaption>
            </a>
          </figure>
        `;
      }

      function bodyImages(value) {
        return String(value || "")
          .split(/\r?\n/)
          .map((line) => line.trim())
          .filter(Boolean)
          .map((line) => {
            const parts = line.split("|").map((part) => part.trim());
            if (parts.length >= 3) return { after: Number(parts[0]) || "end", src: driveImageUrl(parts[1]), caption: parts.slice(2).join(" / ") };
            if (parts.length === 2) return { after: "end", src: driveImageUrl(parts[0]), caption: parts[1] };
            return { after: "end", src: driveImageUrl(parts[0]), caption: "" };
          })
          .filter((item) => item.src);
      }

      function paragraphs(text) {
        return String(text || "")
          .split(/\n{2,}|\r?\n/)
          .map((item) => item.trim())
          .filter(Boolean);
      }

      function renderStory(project, images) {
        const blocks = paragraphs(project.detail_description || project.short_description || "詳細本文は運営確認後に整えます。");
        const used = new Set();
        const html = blocks.map((paragraph, index) => {
          const inlineImages = images.filter((image, imageIndex) => {
            const match = image.after === index + 1;
            if (match) used.add(imageIndex);
            return match;
          });
          return `<p>${escapeHtml(paragraph)}</p>${inlineImages.map((image) => `<figure><img src="${escapeHtml(image.src)}" alt="${escapeHtml(image.caption || project.title)}" onerror="this.closest('figure').classList.add('is-missing')" /><figcaption>${escapeHtml(image.caption || "提出画像")}</figcaption></figure>`).join("")}`;
        }).join("");
        const endImages = images.filter((image, imageIndex) => image.after === "end" || !used.has(imageIndex));
        return `${html}${endImages.map((image) => `<figure><img src="${escapeHtml(image.src)}" alt="${escapeHtml(image.caption || project.title)}" onerror="this.closest('figure').classList.add('is-missing')" /><figcaption>${escapeHtml(image.caption || "提出画像")}</figcaption></figure>`).join("")}`;
      }

      function field(label, value, fallback) {
        return `<div class="preview-field"><span>${escapeHtml(label)}</span><strong>${displayValue(value, fallback)}</strong></div>`;
      }

      function missingItems(project, mainImages, galleryImages) {
        return [
          !project.detail_description && "詳細本文が未入力です。公開前に本文を整える必要があります。",
          !mainImages.length && "タイトル画像・メインビジュアルが未設定です。",
          !galleryImages.length && "商品写真・本文用画像が未設定です。",
          !project.base_product_url && "BASE商品URLが未設定です。",
          !project.image_rights_confirmed && "画像の使用許可メモが未入力です。"
        ].filter(Boolean);
      }

      function showToast(message) {
        const toast = document.querySelector(".toast");
        if (!toast) return;
        toast.textContent = message;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 1800);
      }

      async function copyText(text) {
        try {
          await navigator.clipboard.writeText(text);
          showToast("確認内容をコピーしました");
        } catch (error) {
          showToast("確認内容を生成しました");
        }
      }

      function render(project) {
        const titleImages = imageEntries(project.title_image_urls, project.main_image_url, project.main_visual_uploads);
        const galleryImages = imageEntries(project.detail_image_urls, project.product_image_uploads, project.body_image_uploads, project.creator_profile_uploads);
        const storyImages = bodyImages(project.body_image_blocks);
        if (!storyImages.length) {
          imageEntries(project.body_image_uploads).forEach((image) => storyImages.push({ after: "end", src: image.src, caption: image.label }));
        }
        const mainImage = titleImages[0] || galleryImages[0] || null;
        const missing = missingItems(project, titleImages, galleryImages);
        const currentUrl = location.href;
        const workUrl = `project-work.html?id=${encodeURIComponent(project.project_id || project.id || "")}`;
        document.title = `${project.title || "Project"} 起案者確認 | レボファンディング`;

        root.innerHTML = `
          <section class="preview-hero">
            <div>
              <p class="eyebrow">Creator Preview</p>
              <h1>${displayValue(project.title, "Projectタイトル未設定")}</h1>
              <p class="lead">${displayValue(project.subtitle || project.short_description, "短い説明は未入力です。")}</p>
              <div class="project-status-row"><span class="status next">${displayValue(project.status || "draft")}</span><span>project_id: ${displayValue(project.project_id)}</span></div>
              <div class="preview-summary">
                ${field("目標金額", numberText(project.target_amount, "円"))}
                ${field("目標応援人数", numberText(project.target_supporters, "人"))}
                ${field("達成後ファン目標", numberText(project.fan_target_after_success, "人"))}
                ${field("画像数", `${titleImages.length + galleryImages.length}点`)}
              </div>
            </div>
            <div class="preview-panel">
              <span class="eyebrow">起案者確認</span>
              <h2>公開前の見え方を確認してください</h2>
              <p>このページは確認専用です。文章や数字を直す場合は作業ページへ戻って編集してください。</p>
              <div class="preview-mode-note">編集する場所: 作業ページ / 確認する場所: この確認ページ</div>
              ${missing.length ? `<ul class="preview-note-list">${missing.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>` : ""}
              <div class="preview-actions">
                <a class="button primary" href="${workUrl}">作業ページへ戻る</a>
                <button class="button primary" type="button" data-copy-url>確認URLをコピー</button>
                <button class="button secondary" type="button" data-scroll-approval>OK/修正を送る</button>
              </div>
            </div>
          </section>

          <section class="preview-grid">
            <article class="preview-card preview-story">
              <p class="eyebrow">Preview</p>
              <h2>${displayValue(project.title, "Projectタイトル未設定")}</h2>
              <p class="lead">${displayValue(project.short_description, "短い説明は未入力です。")}</p>
              ${mainImage ? `<figure class="preview-main-image preview-image-tile"><a href="${escapeHtml(mainImage.href)}" target="_blank" rel="noopener"><img src="${escapeHtml(mainImage.src)}" alt="${escapeHtml(project.title || "メイン画像")}" onerror="this.closest('.preview-image-tile').classList.add('is-missing')" /><figcaption>メイン画像を開く</figcaption></a></figure>` : "<p class='preview-muted'>メイン画像は未設定です。</p>"}
              <h3>本文と画像配置</h3>
              ${renderStory(project, storyImages)}
              ${project.image_placement_note ? `<h3>画像の掲載位置メモ</h3><p>${displayValue(project.image_placement_note)}</p>` : ""}
            </article>

            <aside class="preview-card">
              <h2>画像素材</h2>
              ${[...titleImages, ...galleryImages].length ? `<div class="preview-image-grid">${[...titleImages, ...galleryImages].map((image) => imageTile(image, project.title || "提出画像")).join("")}</div>` : "<p class='preview-muted'>画像素材は未設定です。</p>"}
              <h3>画像確認</h3>
              <p>${displayValue(project.image_rights_confirmed, "画像の使用許可は未入力です。")}</p>
              <p>${displayValue(project.image_submission_note, "画像についての補足メモは未入力です。")}</p>
            </aside>
          </section>

          <section class="preview-section">
            <article class="preview-card">
              <p class="eyebrow">Submitted Data</p>
              <h2>申請内容の整理</h2>
              <div class="preview-field-grid">
                ${field("起案者名", project.creator_name)}
                ${field("プロフィール", project.creator_profile)}
                ${field("商品種別", project.product_type)}
                ${field("BASE商品URL", project.base_product_url)}
                ${field("公式サイト / SNS", project.official_url)}
                ${field("一人あたりの応援金額", numberText(project.supporter_unit_amount, "円"))}
                ${field("現在の支援人数", numberText(project.current_supporters, "人"))}
                ${field("販売状況", project.booster_status || project.status)}
              </div>
            </article>
          </section>

          <section class="preview-section" id="approval">
            <article class="preview-card">
              <p class="eyebrow">Approval</p>
              <h2>起案者確認</h2>
              <p class="preview-mode-note">修正がある場合は、ここに書く前に作業ページへ戻って内容を編集してください。</p>
              <label>確認メモ<textarea class="preview-output" data-memo placeholder="この内容でOK、または修正したい箇所を書いてください。"></textarea></label>
              <div class="preview-actions">
                <a class="button secondary" href="${workUrl}">作業ページへ戻る</a>
                <button class="button primary" type="button" data-approval="ok">この内容でOKをコピー</button>
                <button class="button secondary" type="button" data-approval="change">修正希望をコピー</button>
              </div>
              <textarea class="preview-output" data-output readonly></textarea>
            </article>
          </section>
        `;

        root.querySelector("[data-copy-url]")?.addEventListener("click", () => copyText(currentUrl));
        root.querySelector("[data-scroll-approval]")?.addEventListener("click", () => document.getElementById("approval")?.scrollIntoView({ behavior: "smooth" }));
        root.querySelectorAll("[data-approval]").forEach((button) => {
          button.addEventListener("click", () => {
            const memo = root.querySelector("[data-memo]")?.value || "なし";
            const status = button.dataset.approval === "ok" ? "この内容でOK" : "修正希望あり";
            const text = [
              "【レボファンディング 起案者確認】",
              `project_id: ${project.project_id}`,
              `Projectタイトル: ${project.title || ""}`,
              `確認ページ: ${currentUrl}`,
              `確認結果: ${status}`,
              "",
              "【メモ】",
              memo
            ].join("\n");
            const output = root.querySelector("[data-output]");
            if (output) output.value = text;
            copyText(text);
          });
        });
      }

      async function init() {
        const id = new URLSearchParams(location.search).get("id");
        if (!id) {
          root.innerHTML = "<section class='section'><div class='project-empty-state'><strong>project_idがありません。</strong><span>確認URLをもう一度開いてください。</span></div></section>";
          return;
        }

        try {
          const response = await fetch(PROJECTS_CSV_URL, { cache: "no-store" });
          const projects = parseCsv(await response.text());
          const project = projects.find((item) => item.project_id === id || item.id === id);
          if (!project) throw new Error("Project not found");
          render({ ...project, ...loadLocalDraft(id) });
        } catch (error) {
          root.innerHTML = "<section class='section'><div class='project-empty-state'><strong>Projectが見つかりません。</strong><span>ProjectsシートのCSV公開、またはproject_idを確認してください。</span></div></section>";
        }
      }

      init();
    </script>
  </body>
</html>
